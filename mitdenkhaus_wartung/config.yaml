name: Mitdenkhaus Wartung
version: "0.2.1"
slug: mitdenkhaus_wartung
description: Wartungszugang für Mitdenkhaus über Tailscale – nur solange Sie ihn erlauben.
url: https://github.com/mitdenkhaus/mitdenkhaus-addons
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
# tailscale0 entsteht im Netz des Hosts, damit die Wartung Home Assistant
# (Port 8123) und das Betriebssystem so erreicht wie im Heimnetz.
host_network: true
privileged:
  - NET_ADMIN
  - NET_RAW
devices:
  - /dev/net/tun
# Die Geräteidentität im Tailnet gehört zu genau dieser Green. Eine
# wiederhergestellte Sicherung auf anderer Hardware braucht einen neuen Key.
backup_exclude:
  - "tailscale/*"
options:
  authkey: ""
  hostname: ""
  login_server: "https://controlplane.tailscale.com"
  tags:
    - "tag:kunde"
  heimnetz_freigeben: false
schema:
  authkey: "password?"
  hostname: "str?"
  login_server: url
  tags:
    - "str"
  # Heimnetz über Tailscale 4via6 freigeben (nur mit Zustimmung des Kunden).
  heimnetz_freigeben: "bool?"
  # Eindeutige Standort-Nummer, vergibt das Backend.
  standort_id: "int(1,65535)?"
  # Heimnetz von Hand, z. B. 192.168.178.0/24; sonst automatisch erkannt.
  heimnetz: "str?"
